name: Paystamped Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paystamped-watcher
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger Paystamped watcher
        env:
          WATCHER_CRON_SECRET: ${{ secrets.WATCHER_CRON_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          token = os.environ.get("WATCHER_CRON_SECRET")

          if not token:
              print("ERROR: Missing GitHub Actions secret.")
              sys.exit(1)

          data = json.dumps({"json": {"token": token}}).encode()

          request = urllib.request.Request(
              "https://paystamped-ji3sbsl2.teamily.run/trpc/watcher.cron",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "paystamped-watcher-cron/1.0"
              },
              method="POST"
          )

          def show_response(body):
              text = body.decode("utf-8", errors="replace")
              text = text.replace(token, "[REDACTED]")
              print("Paystamped response:")
              print(text[:4096] if text else "[Empty response body]")

          try:
              with urllib.request.urlopen(request, timeout=55) as response:
                  print(f"HTTP Status: {response.status}")
                  show_response(response.read(4096))

          except urllib.error.HTTPError as error:
              print(f"HTTP Error: {error.code}")
              show_response(error.read(4096))
              sys.exit(1)

          except Exception as error:
              print(f"Request failed: {type(error).__name__}")
              sys.exit(1)
          PY
